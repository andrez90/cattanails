:root{--bg:#fff8f6;--card:#fff;--fg:#200c14;--muted:#7c5461;--line:#f0d6da;--accent:#b3123f;--accent2:#560d2b;--rose:#ff9db8;--soft:#ffeef1;--ok:#1f6b45;--okbg:#e6f4ec;--bad:#a3162e;--badbg:#fde8ec;--wa:#14833f;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Cormorant Garamond",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13080c;--card:#20111a;--fg:#ffeef1;--muted:#c9a5b0;--line:#3d202b;--accent:#ff8fae;--accent2:#ff8fae;--soft:#2a1520;--okbg:#14301f;--ok:#7ad6a2;--badbg:#3a1520;--bad:#ff8aa0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,40px)}
h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:wait}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#2a0a15}}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wide{width:100%}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px}
.ic{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--fg);flex:none}
.ic svg{width:18px;height:18px;fill:currentColor}
.ic.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.ic.del{width:30px;height:30px;font-size:18px;line-height:1}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 90% at 85% 10%,#8f1440 0%,#560d2b 38%,#16060d 100%)}
.lcard{width:min(420px,100%);background:var(--card);border-radius:22px;padding:30px 26px;box-shadow:0 30px 60px rgba(0,0,0,.35);display:grid;gap:14px}
.lcard h1{font-size:30px}
.brand{font-family:var(--serif);letter-spacing:.3em;font-size:18px;color:var(--accent2)}.brand small{font-family:var(--sans);letter-spacing:.12em;font-size:11px;color:var(--muted);text-transform:uppercase;margin-left:6px}
#lf{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:13px;font-weight:600}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
textarea{min-height:0;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.lmsg{margin:0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}.lmsg.bad{background:var(--badbg);color:var(--bad)}
.lalt{margin:0;font-size:14px;text-align:center}.lfine{margin:0;font-size:12px;color:var(--muted);text-align:center}
/* estructura */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;background:var(--card);border-right:1px solid var(--line)}
#nav{display:grid;gap:4px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);text-align:left;position:relative}
#nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav button:hover{background:var(--soft);color:var(--fg)}
#nav button[aria-current=page]{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #nav button[aria-current=page]{color:#2a0a15}}
.bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rose);color:#2a0a15;font-size:11px;display:grid;place-items:center}
.who{margin-top:auto;display:grid;gap:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mtop{display:none}
.who .demo,.mtop .demo{background:var(--soft);padding:8px 10px;border-radius:10px;color:var(--fg)}
.view{padding:28px clamp(16px,3vw,40px) 90px;max-width:1180px;width:100%;outline:none;display:grid;gap:18px;align-content:start}
.vh p{margin:4px 0 0;color:var(--muted)}
.vh.row,.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools select{width:auto;min-height:36px;padding:6px 10px;font-size:13px}
.loading{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;align-content:start}
.hint{margin:0;color:var(--muted);font-size:13px;font-weight:400}
.ok{margin:0;padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);font-size:13px}
.warn{color:var(--bad)}
.empty{margin:0;padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:14px}.empty.sm{padding:8px;font-size:13px;border:0;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{font-size:24px;font-weight:700}.kpi small{color:var(--bad);font-size:12px}
.kpi.up b{color:var(--ok)}.kpi.down b{color:var(--bad)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qk{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:600}
.qk b{color:var(--accent)}.qk.hot{background:var(--soft);border-color:var(--rose)}
/* citas */
.appt{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appt .t{font-weight:700;font-size:17px}.appt .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.appt .i{display:grid;gap:2px;min-width:0}.appt .i span{font-size:13.5px;color:var(--muted)}.appt .i em{font-size:13px}
.appt .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.appt.st-cancelada,.appt.st-no_show{opacity:.6}
.tag{justify-self:start;font-size:11.5px!important;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--fg)!important}
.tag.completada{background:var(--okbg);color:var(--ok)!important}.tag.cancelada,.tag.no_show{background:var(--badbg);color:var(--bad)!important}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h3{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding-bottom:6px}
.add{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:18px;line-height:1}
.li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}.li small{color:var(--muted)}
/* clientas y formación */
.search input{max-width:420px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cli,.lead,.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.cli>div:first-child,.lh>div{display:grid}.cli span,.lh span,.contact{font-size:13px;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}.stats b{color:var(--fg)}
.note{margin:0;padding:8px 10px;background:var(--soft);border-radius:10px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:12px}.filters label{min-width:200px}
.lh{display:flex;justify-content:space-between;gap:10px;align-items:start}
.lvl{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.lvl.alto{background:var(--okbg);color:var(--ok)}.lvl.medio{background:var(--soft);color:var(--accent)}.lvl.bajo{background:var(--line);color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}dt{color:var(--muted)}dd{margin:0}
.inl{grid-template-columns:auto 1fr;align-items:center}
.msg p{margin:0;font-size:14px;white-space:pre-wrap}.mh{display:grid}.mh span{font-size:12.5px;color:var(--muted)}
/* finanzas */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar i{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--rose));transform-origin:left;animation:grow .5s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
.sub{font-size:14px;margin-top:6px}
.mov .li{display:grid;grid-template-columns:110px 1fr auto auto}.mov .d{font-size:13px;color:var(--muted)}.mov .c{display:grid}.mov b.in{color:var(--ok)}.mov b.out{color:var(--bad)}
/* web */
form{display:grid;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px}legend{font-size:13px;font-weight:600;padding:0 0 4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal figure{margin:0;border-radius:12px;overflow:hidden;background:var(--soft)}.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.gal figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;font-size:12.5px}
.upl{padding:14px;border:1px dashed var(--line);border-radius:14px}
.svr{display:grid;grid-template-columns:1fr 110px 110px auto auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.svr label{grid-template-columns:auto 1fr;align-items:center;font-weight:500}
.hours{display:grid;gap:8px}.hd{display:grid;grid-template-columns:100px 1fr 1fr;gap:10px;align-items:center}.hd>div{display:flex;gap:6px;align-items:center}.hd span{color:var(--muted);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.inline{grid-template-columns:1fr auto}
/* modal y avisos */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,6,12,.55);display:grid;place-items:center;padding:16px}
.mbox{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.35);display:grid;gap:0;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);width:36px;height:36px}
.mbody{padding:16px 18px;display:grid;gap:12px}.mbody p{margin:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad);color:#fff}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex-direction:row;border-right:0;border-top:1px solid var(--line)}
  .side .brand,.who{display:none}
  #nav{display:flex;width:100%;gap:2px;overflow-x:auto}
  #nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;text-align:center}
  #nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bdg{position:absolute;top:2px;right:8px;margin:0;min-width:16px;height:16px;font-size:10px}
  .view{padding-bottom:110px}
  .cols,.row2,.row3{grid-template-columns:1fr}
  .svr{grid-template-columns:1fr 1fr}.svr input[name=n]{grid-column:1/-1}
  .hd{grid-template-columns:1fr}.mov .li{grid-template-columns:1fr auto auto}.mov .d{grid-column:1/-1}
  .bar{grid-template-columns:90px 1fr auto}
  .mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .mtop .demo{padding:4px 10px;border-radius:999px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app"><p style="padding:24px">Cargando el panel…</p></div><div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>/* ---------- DEMO (solo en la vista previa): imita la base de datos de Catta Nails en el navegador ----------
   Sitio y panel comparten estos datos (localStorage). Los registros de ejemplo llevan "Ejemplo" en el nombre. */
(function(){
var KEY='catta-demo-v2';
var DAYS=['sun','mon','tue','wed','thu','fri','sat'];
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function mins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function rnd(n){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',o='';for(var i=0;i<n;i++)o+=a.charAt(Math.floor(Math.random()*a.length));return o}
function uid(){return 'd'+Date.now().toString(36)+rnd(5)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function norm(p){var d=String(p||'').replace(/[^0-9+]/g,'');if(/^[67]\d{8}$/.test(d))return '+34'+d;if(/^\+?\d{9,15}$/.test(d))return d.charAt(0)==='+'?d:'+'+d;return null}
function seed(){
  var t=new Date(),s={v:2,
    settings:{timezone:'Europe/Madrid',booking_enabled:true,min_notice_minutes:120,max_advance_days:60,slot_step_minutes:30,cancel_limit_hours:4,wa_number:'34602447102',
      working_hours:{mon:[['10:00','14:00'],['16:00','20:00']],tue:[['10:00','14:00'],['16:00','20:00']],wed:[['10:00','14:00'],['16:00','20:00']],thu:[['10:00','14:00'],['16:00','20:00']],fri:[['10:00','14:00'],['16:00','20:00']],sat:[['10:00','14:00']],sun:[]}},
    services:[{id:'s1',name:'Manicura',duration_min:60,buffer_min:0,price:0,active:true,sort:1},{id:'s2',name:'Uñas con diseño',duration_min:90,buffer_min:0,price:0,active:true,sort:2},
      {id:'s3',name:'Mantenimiento',duration_min:60,buffer_min:0,price:0,active:true,sort:3},{id:'s4',name:'Consulta y consejo',duration_min:30,buffer_min:0,price:0,active:true,sort:4}],
    customers:[],appts:[],timeoff:[],leads:[],pays:[],exps:[],content:{},outbox:[],admins:['demo@cattanails']};
  function cust(n,p){var c={id:uid(),full_name:n,phone:p,notes:'',no_show_count:0};s.customers.push(c);return c}
  function ap(c,sv,dayOff,time,st,price){var d=addDays(t,dayOff);var a={id:uid(),customer_id:c.id,service_id:sv.id,service_name:sv.name,date:iso(d),start:mins(time),end:mins(time)+sv.duration_min,status:st,source:dayOff%2?'web':'manual',price:price,code:'CN-'+rnd(4),tok:rnd(24),note:''};s.appts.push(a);return a}
  var c1=cust('Ejemplo · Laura','+34611000001'),c2=cust('Ejemplo · Marta','+34611000002'),c3=cust('Ejemplo · Sara','+34611000003');
  var a1=ap(c1,s.services[1],-6,'10:00','completada',35);s.pays.push({id:uid(),appointment_id:a1.id,category:'salon',amount:35,method:'bizum',concept:'Uñas con diseño',date:a1.date});
  var a2=ap(c2,s.services[0],-3,'16:00','completada',20);s.pays.push({id:uid(),appointment_id:a2.id,category:'salon',amount:20,method:'efectivo',concept:'Manicura',date:a2.date});
  ap(c3,s.services[2],-2,'11:00','no_show',25);
  var tday=t.getDay()===0?1:0;ap(c2,s.services[1],tday,'17:00','confirmada',35);ap(c1,s.services[2],tday+2,'10:30','confirmada',25);ap(c3,s.services[0],tday+3,'12:00','confirmada',20);
  s.exps.push({id:uid(),category:'material',amount:18.5,method:'tarjeta',note:'Esmaltes (ejemplo)',date:iso(addDays(t,-4))});
  s.leads.push({id:uid(),kind:'curso',name:'Ejemplo · Andrea',phone:'+34611000010',instagram:'@ejemplo.andrea',answers:{objetivo:'Montar mi propio negocio',experiencia:'Empiezo desde cero',inicio:'Lo antes posible',presencial:'Sí, sin problema',inversion:'Tengo presupuesto para empezar'},score:90,status:'nuevo',notes:'',created_at:new Date(t-864e5).toISOString()});
  s.leads.push({id:uid(),kind:'curso',name:'Ejemplo · Carla',phone:'+34611000011',instagram:'@ejemplo.carla',answers:{objetivo:'Es un hobby',experiencia:'Ya hago uñas por mi cuenta',inicio:'Solo me estoy informando',presencial:'Vivo lejos, pero me organizo',inversion:'Depende del precio'},score:30,status:'contactado',notes:'Le escribí el lunes.',created_at:new Date(t-3*864e5).toISOString()});
  s.leads.push({id:uid(),kind:'lista',name:'Ejemplo · Nuria',contact:'@ejemplo.nuria',answers:{},score:0,status:'nuevo',notes:'',created_at:new Date(t-2*864e5).toISOString()});
  s.outbox.push({id:uid(),kind:'curso',to_phone:'+34611000010',to_name:'Ejemplo · Andrea',body:'Hola Andrea, soy Pilar de Catta Nails 29. Recibí tu solicitud para el curso de uñas. Te escribo para contarte fechas, duración y precio. ¿Cuándo te viene bien hablar?',send_at:new Date(t-864e5).toISOString(),status:'pendiente'});
  return s}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2)return s}catch(e){}var x=seed();save(x);return x}

var SK='catta-adm-s',S=null;

function setS(x){S=x;try{x?localStorage.setItem(SK,JSON.stringify(x)):localStorage.removeItem(SK)}catch(e){}}
function auth(path,body,method,tok){return fetch(SBU+'/auth/v1/'+path,{method:method||'POST',headers:{'Content-Type':'application/json',apikey:SBK,Authorization:'Bearer '+(tok||SBK)},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(authMsg(j));return j})})}
function authMsg(j){var m=(j&&(j.error_description||j.msg||j.message||j.error))||'';
  if(/invalid login/i.test(m))return 'Correo o contraseña incorrectos.';if(/not confirmed/i.test(m))return 'Falta confirmar tu correo: abre el enlace que te llegó.';
  if(/already registered/i.test(m))return 'Ese correo ya tiene acceso. Inicia sesión o recupera la contraseña.';if(/password/i.test(m)&&/6/.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/rate|seconds/i.test(m))return 'Demasiados intentos. Espera un minuto y vuelve a probar.';return m||'No se pudo completar. Inténtalo de nuevo.'}
function keep(j){setS({at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,email:(j.user&&j.user.email)||(S&&S.email)||''})}
function token(){if(!S)return Promise.reject(new Error('login'));if(Date.now()<S.exp)return Promise.resolve(S.at);
  return auth('token?grant_type=refresh_token',{refresh_token:S.rt}).then(function(j){keep(j);return S.at},function(){setS(null);throw new Error('login')})}
function rpc(name,body){
  if(DEMO)return window.__demoRpc(name,body);
  return token().then(function(t){return fetch(SBU+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:SBK,Authorization:'Bearer '+t},body:JSON.stringify(body||{})})})
    .then(function(r){return r.json().catch(function(){return null}).then(function(j){
      if(r.status===401){setS(null);showLogin('Tu sesión caducó. Vuelve a entrar.');throw new Error('login')}
      if(!r.ok)throw new Error(j&&/no_admin/.test(j.message||'')?'Tu usuario no tiene permiso de administración.':'No se pudo guardar. Revisa tu conexión.');return j})})}

function showLogin(msg,mode){
  mode=mode||'in';
  app.innerHTML='<div class="login"><div class="lcard"><div class="brand">CATTA <small>Panel</small></div>'+
    '<h1>'+(mode==='in'?'Entra a tu panel':mode==='up'?'Crea tu acceso':mode==='pw'?'Nueva contraseña':'Recupera tu contraseña')+'</h1>'+
    (msg?'<p class="lmsg">'+esc(msg)+'</p>':'')+
    '<form id="lf" novalidate>'+(mode!=='pw'?'<label>Correo<input type="email" name="email" autocomplete="username" required></label>':'')+
    (mode!=='rec'?'<label>Contraseña<input type="password" name="pw" autocomplete="'+(mode==='in'?'current-password':'new-password')+'" minlength="6" required></label>':'')+
    '<button class="btn wide">'+(mode==='in'?'Entrar':mode==='up'?'Crear acceso':mode==='pw'?'Guardar contraseña':'Enviarme el enlace')+'</button></form>'+
    '<p class="lalt">'+(mode==='in'?'<a href="#" data-m="rec">Olvidé mi contraseña</a> · <a href="#" data-m="up">Primera vez: crear acceso</a>':'<a href="#" data-m="in">Volver a entrar</a>')+'</p>'+
    '<p class="lfine">Solo pueden entrar los correos autorizados. Si te invitaron, crea tu acceso con ese correo.</p></div></div>';
  $$('[data-m]').forEach(function(a){a.onclick=function(e){e.preventDefault();showLogin('',a.getAttribute('data-m'))}});
  $('#lf').onsubmit=function(e){e.preventDefault();var f=e.target,b=$('button',f),em=val(f,'email'),pw=f.elements.pw?f.elements.pw.value:'';
    if(mode!=='pw'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return showErr('Escribe un correo válido.');
    if(mode!=='rec'&&pw.length<6)return showErr('La contraseña debe tener al menos 6 caracteres.');
    b.disabled=true;var back=location.origin+location.pathname;
    var p=mode==='in'?auth('token?grant_type=password',{email:em,password:pw}).then(function(j){keep(j);start()}):
      mode==='up'?auth('signup?redirect_to='+encodeURIComponent(back),{email:em,password:pw}).then(function(j){if(j.access_token){keep(j);start()}else showLogin('Te enviamos un correo para confirmar tu acceso. Ábrelo y luego entra aquí.','in')}):
      mode==='rec'?auth('recover?redirect_to='+encodeURIComponent(back),{email:em}).then(function(){showLogin('Si ese correo tiene acceso, te llegará un enlace para crear una contraseña nueva.','in')}):
      auth('user',{password:pw},'PUT',S&&S.at).then(function(){toast('Contraseña guardada');start()});
    p.catch(function(err){b.disabled=false;showErr(err.message)})};
  function showErr(m){var x=$('.lmsg');if(!x){x=document.createElement('p');x.className='lmsg';$('#lf').parentNode.insertBefore(x,$('#lf'))}x.textContent=m;x.classList.add('bad')}
}

  function rng(d,i){var r=(wh[d]||[])[i]||['',''];return '<input type="time" name="'+d+i+'a" value="'+esc(r[0])+'" aria-label="'+DN[d]+' tramo '+(i+1)+' desde"><span>a</span><input type="time" name="'+d+i+'b" value="'+esc(r[1])+'" aria-label="'+DN[d]+' tramo '+(i+1)+' hasta">'}
  var v=V('<header class="vh"><h1>Mi web</h1><p>Lo que cambies aquí se ve en la web al momento, sin tocar código.</p></header>'+
    '<section class="card"><h2>Textos</h2><form id="txf">'+TEXTS.map(function(t){var x=c[t[0]];return '<label>'+esc(t[1])+'<input name="'+t[0]+'" maxlength="220" value="'+esc(typeof x==='string'?x:'')+'"><small>'+esc(t[2])+'</small></label>'}).join('')+'<button class="btn">Guardar textos</button></form></section>'+
    '<section class="card"><h2>Fotos de trabajos</h2><p class="hint">Sube fotos nuevas a la galería «Elige tu diseño». Cada foto lleva su botón «Quiero este» para reservar. Mejor en vertical y con buena luz.</p>'+
      '<div class="gal" id="galx">'+extra.map(function(g,i){return '<figure><img src="'+esc(g.url)+'" alt="'+esc(g.nombre)+'" loading="lazy"><figcaption>'+esc(g.nombre)+'<button type="button" class="ic del" data-gx="'+i+'" aria-label="Quitar foto">×</button></figcaption></figure>'}).join('')+'</div>'+
      '<form id="upf" class="upl"><label>Foto<input type="file" name="f" accept="image/jpeg,image/png,image/webp" required></label><label>Nombre del diseño<input name="n" maxlength="40" placeholder="Ej.: French nude con brillos" required></label><fieldset><legend>Estilo</legend>'+
        Object.keys(GALCATS).map(function(k){return '<label class="chk"><input type="checkbox" name="c" value="'+k+'"> '+GALCATS[k]+'</label>'}).join('')+'</fieldset><button class="btn">Subir foto</button></form>'+
      '<h3 class="sub">Fotos que ya trae la web</h3><p class="hint">Desmarca las que no quieras mostrar.</p><form id="hdf">'+GALDEF.map(function(n){return '<label class="chk"><input type="checkbox" name="g" value="'+esc(n)+'"'+(hid.indexOf(n)<0?' checked':'')+'> '+esc(n)+'</label>'}).join('')+'<button class="btn ghost">Guardar</button></form></section>'+
    '<section class="card"><h2>Servicios y precios de la reserva</h2><p class="hint">La duración decide qué horas libres se muestran. El precio se usa al marcar la cita como hecha.</p><div id="svl">'+s.services.map(svRow).join('')+'</div><button type="button" class="btn ghost" id="svadd">+ Añadir servicio</button></section>'+
    '<section class="card"><h2>Horario de reservas</h2><form id="hrf"><div class="hours">'+Object.keys(DN).map(function(d){return '<div class="hd"><b>'+DN[d]+'</b><div>'+rng(d,0)+'</div><div>'+rng(d,1)+'</div></div>'}).join('')+'</div>'+
      '<div class="row3"><label>Aviso mínimo (horas)<input name="mn" type="number" min="0" max="168" value="'+Math.round(st.min_notice_minutes/60)+'"></label><label>Reservar hasta (días)<input name="ad" type="number" min="1" max="365" value="'+st.max_advance_days+'"></label><label>Cancelar hasta (horas antes)<input name="cl" type="number" min="0" max="168" value="'+st.cancel_limit_hours+'"></label></div>'+
      '<div class="row3"><label>Cada cuánto empieza una cita (min)<input name="sp" type="number" min="5" max="120" step="5" value="'+st.slot_step_minutes+'"></label><label>Tu WhatsApp (con prefijo)<input name="wa" inputmode="tel" value="'+esc(st.wa_number)+'"></label><label class="chk"><input type="checkbox" name="on"'+(st.booking_enabled?' checked':'')+'> Reservas en línea abiertas</label></div><button class="btn">Guardar horario</button></form></section>'+
    '<section class="card"><h2>Quién puede entrar al panel</h2><div>'+s.admins.map(function(e){return '<div class="li"><span>'+esc(e)+'</span><button type="button" class="btn sm ghost" data-rm="'+esc(e)+'">Quitar</button></div>'}).join('')+s.invites.map(function(e){return '<div class="li"><span>'+esc(e)+' <small>(invitada, aún no entra)</small></span><button type="button" class="btn sm ghost" data-rm="'+esc(e)+'">Quitar</button></div>'}).join('')+'</div>'+
      '<form id="ivf" class="inline"><input type="email" name="e" placeholder="correo@ejemplo.com" aria-label="Correo a invitar" required><button class="btn">Invitar</button></form><p class="hint">La persona invitada entra en este panel con «Primera vez: crear acceso» usando ese correo.</p></section>');
  function svRow(x){return '<form class="svr" data-id="'+esc(x.id||'')+'"><input name="n" value="'+esc(x.name||'')+'" placeholder="Nombre" aria-label="Nombre del servicio" required maxlength="60"><label>min<input name="d" type="number" min="10" max="480" step="5" value="'+esc(x.duration_min||60)+'"></label><label>€<input name="p" type="number" min="0" step="0.5" value="'+esc(x.price||0)+'"></label><label class="chk"><input type="checkbox" name="a"'+(x.active!==false?' checked':'')+'> Activo</label><button class="btn sm">Guardar</button></form>'}
  $('#txf').onsubmit=function(e){e.preventDefault();var f=e.target,ps=TEXTS.map(function(t){var x=f.elements[t[0]].value.trim();return (c[t[0]]||'')===x?null:rpc('adm_content_set',{p_key:t[0],p_value:x||null})}).filter(Boolean);
    Promise.all(ps).then(function(){toast(ps.length?'Textos guardados: ya se ven en la web':'No había cambios');settings(true)}).catch(fail)};
  $('#svl').onsubmit=function(e){e.preventDefault();var f=e.target;rpc('adm_service_save',{p:{id:f.dataset.id||null,name:val(f,'n'),duration_min:+val(f,'d'),price:+val(f,'p')||0,active:f.elements.a.checked}}).then(chk).then(function(r){f.dataset.id=r.id;toast('Servicio guardado');settings(true)}).catch(fail)};
  $('#svadd').onclick=function(){var d=document.createElement('div');d.innerHTML=svRow({});$('#svl').appendChild(d.firstChild);$('#svl form:last-child input').focus()};
  $('#hrf').onsubmit=function(e){e.preventDefault();var f=e.target,w={},bad=false;Object.keys(DN).forEach(function(d){w[d]=[];[0,1].forEach(function(i){var a=f.elements[d+i+'a'].value,b=f.elements[d+i+'b'].value;if(a&&b){if(b<=a)bad=true;w[d].push([a,b])}})});
    if(bad){toast('En cada tramo la hora final debe ir después de la inicial.',true);return}
    rpc('adm_settings_set',{p:{working_hours:w,min_notice_minutes:Math.round(+val(f,'mn')*60),max_advance_days:+val(f,'ad'),cancel_limit_hours:+val(f,'cl'),slot_step_minutes:+val(f,'sp'),wa_number:val(f,'wa'),booking_enabled:f.elements.on.checked}}).then(function(){toast('Horario guardado');settings(true)}).catch(fail)};
  $('#hdf').onsubmit=function(e){e.preventDefault();var h=GALDEF.filter(function(n){return !$$('input[name=g]',e.target).some(function(i){return i.checked&&i.value===n})});rpc('adm_content_set',{p_key:'gal.ocultar',p_value:h.length?h:null}).then(function(){toast('Galería guardada');settings(true)}).catch(fail)};
  $('#galx').onclick=function(e){var b=e.target.closest('[data-gx]');if(!b)return;var n=extra.slice();n.splice(+b.dataset.gx,1);rpc('adm_content_set',{p_key:'gal.extra',p_value:n.length?n:null}).then(function(){toast('Foto quitada de la web');vWeb()}).catch(fail)};
  $('#upf').onsubmit=function(e){e.preventDefault();var f=e.target,file=f.elements.f.files[0],n=val(f,'n'),cats=$$('input[name=c]:checked',f).map(function(i){return i.value});
    if(!file||!n){toast('Elige una foto y escribe el nombre.',true);return}var b=$('button',f);b.disabled=true;b.textContent='Subiendo…';
    shrink(file).then(upload).then(function(url){var x=extra.concat([{url:url,nombre:n.slice(0,40),estilos:cats.join(' ')||'color'}]);return rpc('adm_content_set',{p_key:'gal.extra',p_value:x})})
      .then(function(){toast('Foto subida: ya está en la web');vWeb()}).catch(function(err){b.disabled=false;b.textContent='Subir foto';fail(err)})};
  $('#ivf').onsubmit=function(e){e.preventDefault();rpc('adm_invite',{p_email:val(e.target,'e'),p_remove:false}).then(chk).then(function(){toast('Invitación guardada');vWeb()}).catch(fail)};
  v.addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b)modal('¿Quitar acceso?','<p>'+esc(b.dataset.rm)+' ya no podrá entrar al panel.</p>',function(){return rpc('adm_invite',{p_email:b.dataset.rm,p_remove:true}).then(chk).then(function(){toast('Acceso quitado');vWeb()})},'Quitar')});
})}
/* reduce la foto en el navegador (máx. 1400 px, WebP) para que la web cargue rápido */
function shrink(file){return new Promise(function(res,rej){if(file.size>15e6)return rej(new Error('La foto pesa demasiado (máx. 15 MB).'));var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var k=Math.min(1,1400/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    cv.toBlob(function(b){b?res(b):rej(new Error('No se pudo preparar la foto.'))},'image/webp',.82)};img.onerror=function(){rej(new Error('Ese archivo no es una imagen válida.'))};img.src=u})}
function upload(blob){if(DEMO)return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(blob)});
  var path='gal/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.webp';
  return token().then(function(t){return fetch(SBU+'/storage/v1/object/media/'+path,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+t,'Content-Type':'image/webp','x-upsert':'false'},body:blob})})
    .then(function(r){if(!r.ok)throw new Error('No se pudo subir la foto ('+r.status+').');return SBU+'/storage/v1/object/public/media/'+path})}

start();
})();
</script>
